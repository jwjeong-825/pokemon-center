kk<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>주원이의 포켓몬센터</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
</head>

<body>

    <div class="container">

        <h1>주원이의 포켓몬센터</h1>

        <div class="section pc-section">
            <h2>포켓몬 PC</h2>
            <p>포켓몬을 PC에 맡기고, 조회하고, 다시 데리고 갈 수 있습니다.</p>

            <input type="text" id="name" placeholder="포켓몬 이름">
            <input type="number" id="level" placeholder="레벨">

	    <button onclick="addPokemon()">PC에 맡기기</button>
            <button onclick="loadPokemon()">PC 목록 보기</button>

            <ul id="pokemon-list"></ul>
        </div>

        <div class="section nurse-section">
            <h2>간호사 치유실</h2>
            <p>간호사가 포켓몬을 치료해줍니다.</p>

            <button onclick="healPokemon()">포켓몬 치료하기</button>
        </div>

    </div>

    <script>
        async function loadPokemon() {
            const response = await fetch("/computer");
            const data = await response.json();

            const list = document.getElementById("pokemon-list");
            list.innerHTML = "";

            for (let pokemon of data) {
                list.innerHTML += `
                    <li>
                        ${pokemon.name} - Lv.${pokemon.level}
                        <button onclick="deletePokemon('${pokemon.name}')">
                            데리고 가기
                        </button>
                    </li>
                `;
            }
        }

        async function addPokemon() {
            const name = document.getElementById("name").value;
            const level = document.getElementById("level").value;

            await fetch("/computer/deposit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    level: Number(level)
                })
            });

            loadPokemon();
        }

        async function deletePokemon(name) {
            await fetch(`/computer/discharge/${name}`, {
                method: "DELETE"
            });

            loadPokemon();
        }

        async function healPokemon() {
            const response = await fetch("/nurse/heal", {
                method: "POST"
            });

            const result = await response.json();
            alert(result.message);
        }
    </script>

</body>
</html>
