<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>주원이의 포켓몬센터</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
</head>

<body>

    <div class="game-wrapper">

        <div class="game-frame">

            <div class="pc-panel">
                <h2>포켓몬 PC</h2>

                <button onclick="addPokemon()">
                    PC 맡기기
                </button>

                <button onclick="loadPokemon()">
                    목록 보기
                </button>
            </div>

            <div class="heal-panel">
                <h2>간호사 치유실</h2>

                <button onclick="healPokemon()">
                    포켓몬 치료
                </button>
            </div>

            <div class="pokemon-panel">
                <h3>맡긴 포켓몬</h3>
                <ul id="pokemon-list"></ul>
            </div>

        </div>

    </div>

    <script>
        async function loadPokemon() {
            const response = await fetch("/computer");
            const data = await response.json();

            const list = document.getElementById("pokemon-list");
            list.innerHTML = "";

            for (let pokemon of data) {
                list.innerHTML += `
                    <li>
                        ${pokemon.name} - Lv.${pokemon.level}

                        <button onclick="deletePokemon(${pokemon.id})">
                            데리고 가기
                        </button>
                    </li>
                `;
            }
        }

        async function addPokemon() {
            const name = prompt("포켓몬 이름 입력");
            const level = prompt("레벨 입력");

            await fetch("/computer/deposit", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name: name,
                    level: Number(level)
                })
            });

            loadPokemon();
        }

        async function deletePokemon(id) {
            await fetch(`/computer/discharge/id/${id}`, {
                method: "DELETE"
            });

            loadPokemon();
        }

        async function healPokemon() {
            const response = await fetch("/nurse/heal", {
                method: "POST"
            });

            const result = await response.json();
            alert(result.message);
        }
    </script>

</body>
</html>
